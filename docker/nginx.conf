events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    sendfile on;
    keepalive_timeout 65;

    # Increase client body size for file uploads
    client_max_body_size 100M;

    upstream backend {
        server backend:8000;
    }

    server {
        listen 80;
        server_name localhost;

        # Frontend static files
        location / {
            root /usr/share/nginx/html;
            try_files $uri $uri/ /index.html;
        }

        # API proxy
        location /api {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_cache_bypass $http_upgrade;
            
            # Increase timeouts for long-running operations
            proxy_connect_timeout 300s;
            proxy_send_timeout 300s;
            proxy_read_timeout 300s;
        }

        # WebSocket proxy
        location /ws {
            proxy_pass http://backend;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "Upgrade";
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # Result file serving with security
        location ~ ^/results/([^/]+)/(.+)$ {
            # Extract session_id and filename from URL
            set $session_id $1;
            set $filename $2;
            
            # Validate access via backend before serving file
            auth_request /api/downloads/validate/$session_id/$filename;
            auth_request_set $auth_status $upstream_status;
            
            # Serve file from Docker volume
            alias /var/www/results/$session_id/$filename;
            
            # Security: Disable directory listing
            autoindex off;
            
            # Support partial downloads for large files (resume capability)
            # This enables the Range header for chunked downloads
            add_header Accept-Ranges bytes;
            
            # Force download with original filename
            # Extract base filename without path
            add_header Content-Disposition "attachment; filename=\"$filename\"";
            
            # Set appropriate MIME types
            types {
                application/octet-stream fbx;
                model/gltf-binary glb;
                model/obj obj;
                model/vrm vrm;
            }
            
            # Enable efficient file transfers
            sendfile on;
            tcp_nopush on;
            tcp_nodelay on;
            
            # Cache control for downloaded files (browser can cache for 1 hour)
            add_header Cache-Control "private, max-age=3600";
            
            # CORS headers for file downloads
            add_header Access-Control-Allow-Origin $http_origin always;
            add_header Access-Control-Allow-Credentials true always;
            add_header Access-Control-Expose-Headers "Content-Length, Content-Range" always;
            
            # Security headers
            add_header X-Content-Type-Options nosniff;
            add_header X-Frame-Options DENY;
        }
    }
}
